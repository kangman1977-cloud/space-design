<title>排版比較樣板</title>
<!--
  樣板：排版擺得不夠緊（STATUS 真待辦，kang 2026-10-15「同意你的建議」—— 先沙箱量＋樣板）。
  同一批片，上面一排是「現在」的擺法（一列一列、每片固定轉成比較扁的方向），
  下面一排是「新的」擺法（任何空位都能塞、兩個方向都試、幾種順序各排一次取用板最少的；⛔ 會比現在差）。
  每一片畫的是它的「外框」—— 真的片在框裡面（排版本來就是照外框排）。
  資料由沙箱腳本照 js/out/nest.js 的 packBoards()（現在）與新的擺法算出來，直接寫在這個檔裡。
  ⚠ 這是樣板，程式是另外寫的。
-->
<style>
  :root { --bg: #1b1e23; --panel: #23272e; --ink: #e6e9ee; --muted: #9aa3ae; --line: #343a44; --accent: #4a90e2; --good: #7fd18f; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink);
    font: 14px/1.5 system-ui, -apple-system, "Segoe UI", "Microsoft JhengHei", sans-serif; }
  header { position: sticky; top: 0; z-index: 2; padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--line);
    display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; }
  header h1 { font-size: 16px; margin: 0; width: 100%; }
  button { background: #2c323b; color: var(--ink); border: 1px solid #3c444f; border-radius: 6px; padding: 4px 10px; cursor: pointer; font: inherit; }
  button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .note { color: var(--muted); font-size: 12px; width: 100%; }
  main { padding: 12px 16px 40px; }
  .case { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; margin-bottom: 14px; }
  .case h2 { font-size: 15px; margin: 0 0 6px; }
  .case h2 .n { font-weight: normal; color: var(--muted); }
  .case h2 .win { color: var(--good); font-weight: bold; }
  .row { display: flex; gap: 8px; align-items: flex-start; margin: 6px 0; flex-wrap: wrap; }
  .lab { width: 64px; flex: none; color: var(--muted); padding-top: 4px; }
  .boards { display: flex; gap: 8px; flex-wrap: wrap; flex: 1; min-width: 0; }
  svg { background: #fff; border-radius: 3px; }
  .legend i { display: inline-block; width: 12px; height: 12px; border-radius: 2px; vertical-align: -1px; margin: 0 3px 0 10px; }
  @media (max-width: 640px) { .lab { width: 100%; padding: 0; } header { padding: 8px 10px; } main { padding: 10px; } }
</style>
</head>

</header>

let cur = 0;
const sets = document.getElementById('sets');
DATA.forEach((s, i) => {
  const b = document.createElement('button');
  b.textContent = s.label;
  b.onclick = () => { cur = i; render(); };
  sets.appendChild(b);
});
function boardSVG(b, scale) {
  const W = b.w * scale, H = b.h * scale;
  let s = `<svg width="${W.toFixed(0)}" height="${H.toFixed(0)}" viewBox="0 0 ${b.w} ${b.h}">`;
  s += `<rect x="0" y="0" width="${b.w}" height="${b.h}" fill="#fff" stroke="${b.oversize ? '#d33' : '#888'}" stroke-width="${1 / scale}"/>`;
  for (const it of b.items) {
    s += `<rect x="${it.x}" y="${it.y}" width="${it.w}" height="${it.h}" fill="${it.rot ? '#f0b45a' : '#6fa8dc'}" fill-opacity=".8" stroke="#334" stroke-width="${0.8 / scale}"/>`;
  }
  return s + '</svg>';
}
function render() {
  [...sets.children].forEach((b, i) => b.classList.toggle('on', i === cur));
  const s = DATA[cur];
  const main = document.getElementById('main');
  main.innerHTML = '';
  const maxH = Math.max(...s.cases.flatMap(c => [...c.old, ...c.neu].map(b => b.h)));
  const scale = Math.min(0.75, 180 / maxH);
  for (const c of s.cases) {
    const d = document.createElement('div');
    d.className = 'case';
    const a = c.old.length, n = c.neu.length;
    d.innerHTML = `<h2>${c.name}　<span class="n">現在 ${a} 張 → 新的 </span>`
      + `<span class="${n < a ? 'win' : 'n'}">${n} 張${n < a ? `（省 ${a - n} 張）` : '（一樣）'}</span></h2>`
      + `<div class="row"><div class="lab">現在</div><div class="boards">${c.old.map(b => boardSVG(b, scale)).join('')}</div></div>`
      + `<div class="row"><div class="lab">新的</div><div class="boards">${c.neu.map(b => boardSVG(b, scale)).join('')}</div></div>`;
    main.appendChild(d);
  }
}
render();
</script>
