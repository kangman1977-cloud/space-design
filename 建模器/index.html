<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>建模器 — 第 3 期</title>
<!-- 加到主畫面（跟另外兩個工具同一套做法）。
     manifest 放在上一層跟另外兩份並排，裡面的路徑是相對於 manifest 自己的位置。
     black-translucent 會讓內容跑到 iOS 狀態列底下，所以版面一律靠
     env(safe-area-inset-*) 讓開 —— 這是專案踩過的坑第 7 條。 -->
<link rel="manifest" href="../manifest-modeler.webmanifest">
<meta name="theme-color" content="#1b1e23">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="建模器">
<link rel="apple-touch-icon" href="../icons/modeler-180.png">
<style>
/* ══ 基本 ══════════════════════════════════════════ */
* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0; height: 100%; overflow: hidden;
  background: #1b1e23; color: #e8eaed;
  font-family: "Microsoft JhengHei", "PingFang TC", system-ui, sans-serif;
  font-size: 14px; overscroll-behavior: none;
}
#app { position: fixed; inset: 0; display: flex; flex-direction: column; }

/* ══ 工具列 ════════════════════════════════════════ */
#bar {
  flex: none; z-index: 20;
  display: flex; flex-wrap: wrap; align-items: center; gap: 6px;
  padding: 8px calc(8px + env(safe-area-inset-right)) 8px calc(8px + env(safe-area-inset-left));
  padding-top: calc(8px + env(safe-area-inset-top));
  background: #24272e; border-bottom: 1px solid #3a3f48;
}
.grp {
  /* flex-wrap：一組按鈕自己也要能換行。
     #bar 本來就會在「組與組之間」換行，但**單一組塞不下時只會被切掉**，
     而被切掉的按鈕看起來就像不存在。工具列每加一顆按鈕就更窄一分，
     平板尤其容易踩到。加這一行的成本是零。 */
  display: flex; align-items: center; gap: 4px; flex-wrap: wrap;
  padding: 3px 8px 3px 6px; border: 1px solid #3a3f48; border-radius: 8px;
}
.grp > .lbl {
  flex: none; white-space: nowrap;
  font-size: 11px; color: #8b93a1; margin-right: 2px;
}
button, select, input {
  font-family: inherit; font-size: 13px;
}
button {
  flex: none; white-space: nowrap;
  padding: 6px 11px; border-radius: 6px;
  border: 1px solid #454b56; background: #2f333c; color: #e8eaed;
  cursor: pointer; user-select: none; -webkit-user-select: none;
}
button:hover:not(:disabled) { background: #3a3f4a; }
button:active:not(:disabled) { background: #4a5160; }
button.on { background: #2f6fd0; border-color: #4d8ae8; color: #fff; }
button.warn { border-color: #7a4040; }
button:disabled { opacity: .35; cursor: default; }
select {
  padding: 6px 8px; border-radius: 6px;
  border: 1px solid #454b56; background: #2f333c; color: #e8eaed;
}

/* ══ 主體 ══════════════════════════════════════════ */
#main { flex: 1 1 auto; display: flex; min-height: 0; }
#stage { flex: 1 1 auto; position: relative; min-width: 0; }
#cv { display: block; width: 100%; height: 100%; touch-action: none; }

/* 框選的矩形。pointer-events:none 讓它不會擋住底下的拖曳事件 */
#marqueeBox {
  position: absolute; z-index: 4; pointer-events: none;
  border: 1px solid #6fa8ff; background: rgba(111,168,255,.16);
}

/*
  ⛔ **`#knifeLine` 已於 2026-08-26 移除，不要再加回來。**

  它是刀具第一版（螢幕上那條橘虛線）留下的殘骸 —— 元素與 CSS 都還在，
  但**沒有任何一行程式在更新它**（grep 過整個 js/，沒有人寫 x2/y2）。

  🔴 **第一版失敗的原因正是「畫在螢幕上」**：切點是**模型上的位置**，
  畫在螢幕座標系裡，一轉視角就對不上（當時的症狀是「預覽一直亂跳」）。
  現在的預覽畫在 3D 場景裡（`scene.js` 的 `setKnifePreview()`），
  **一筆畫也走同一條路**，⛔ 不會把這個疊層挖回來。
*/

/* ══ 右側面板 ══════════════════════════════════════ */
#panel {
  flex: none; width: 300px; overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  background: #20232a; border-left: 1px solid #3a3f48;
  padding-bottom: calc(16px + env(safe-area-inset-bottom));
}
#panel section { border-bottom: 1px solid #2c313a; }
#panel h2 {
  margin: 0; padding: 10px 14px; font-size: 12px; font-weight: 600;
  color: #8b93a1; letter-spacing: .5px; background: #24272e;
  display: flex; justify-content: space-between; align-items: center;
}
button.mini {
  padding: 3px 9px; font-size: 11px; border-radius: 5px;
}
#panel .empty {
  padding: 22px 14px; text-align: center; color: #6f7681;
  font-size: 12.5px; line-height: 1.7;
}
#panel .empty span { font-size: 11.5px; color: #565c66; }
#pForm { padding: 8px 14px 14px; }
.row {
  display: flex; align-items: center; gap: 8px; margin: 6px 0;
}
.row > label {
  flex: none; width: 78px; font-size: 12px; color: #a8b0bd;
}
.row > input, .row > select { flex: 1 1 auto; min-width: 0; }
.row input[type=text], .row input[type=number], .row select {
  padding: 5px 8px; border-radius: 5px;
  border: 1px solid #3f4550; background: #191c21; color: #e8eaed;
  font-variant-numeric: tabular-nums;
}
.row input[type=checkbox] { width: 17px; height: 17px; flex: none; }
.row input[type=color] {
  flex: none; width: 46px; height: 28px; padding: 0;
  border: 1px solid #3f4550; border-radius: 5px; background: #191c21;
}
.row input:disabled { opacity: .4; }
.row.vec { gap: 6px; }
.row.vec > div { flex: 1 1 0; min-width: 0; display: flex; align-items: center; gap: 4px; }
.row.vec span { flex: none; font-size: 11px; color: #6f7681; width: 10px; }
.row.vec input { width: 100%; min-width: 0; }
#pForm .sub {
  margin: 14px 0 6px; padding-top: 10px; border-top: 1px solid #2c313a;
  font-size: 11px; color: #8b93a1; font-weight: 600; letter-spacing: .4px;
}
#pForm .note {
  margin: 8px 0; padding: 7px 10px; border-radius: 6px;
  background: rgba(47,111,208,.12); border: 1px solid #2c4a75;
  font-size: 11.5px; color: #a8c0e0; line-height: 1.6;
}
#pForm .badNote {
  margin: 8px 0; padding: 7px 10px; border-radius: 6px;
  background: rgba(178,70,70,.14); border: 1px solid #7a4040;
  font-size: 11.5px; color: #f0b8b8; line-height: 1.6;
}
button.wide { width: 100%; margin-top: 10px; }

/* 對齊面板：一列 = 一個軸，後面接三顆等寬的按鈕 */
.alignRow { display: flex; align-items: center; gap: 6px; margin: 6px 0; }
.alignRow > label {
  flex: none; width: 52px; font-size: 12px; color: #a8b0bd;
}
.alignRow > button {
  flex: 1 1 0; min-width: 0; padding: 5px 2px; font-size: 11.5px;
  white-space: nowrap;      /* 空間不足時被壓成直排，見坑第 5 條 */
}

/* ══ 布林運算樹 ════════════════════════════════════ */
.tree { margin: 4px 0 2px; }
.tree .op {
  display: flex; align-items: center; gap: 8px; margin: 8px 0 6px;
}
.tree .op > label { flex: none; width: 78px; font-size: 12px; color: #a8b0bd; }
.tree .op > select { flex: 1 1 auto; min-width: 0;
  padding: 5px 8px; border-radius: 5px;
  border: 1px solid #3f4550; background: #191c21; color: #e8eaed;
}
.tree .item {
  margin: 5px 0; border: 1px solid #333944; border-radius: 6px;
  background: #1c1f25; overflow: hidden;
}
.tree .itemHead {
  display: flex; align-items: center; gap: 7px;
  padding: 7px 9px; cursor: pointer; user-select: none; -webkit-user-select: none;
}
.tree .itemHead:hover { background: #232830; }
.tree .sym {
  flex: none; width: 20px; text-align: center;
  font-size: 13px; color: #7fb0f0; font-variant-numeric: tabular-nums;
}
.tree .nm {
  flex: 1 1 auto; min-width: 0; font-size: 12px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.tree .dims { flex: none; font-size: 10.5px; color: #6f7681; }
.tree .caret { flex: none; font-size: 10px; color: #6f7681; width: 12px; }
.tree .itemBody {
  padding: 2px 9px 9px; border-top: 1px solid #2a2f38;
}
.tree .itemBody .row > label { width: 66px; font-size: 11.5px; }
.tree .roleTag {
  flex: none; padding: 1px 6px; border-radius: 4px;
  font-size: 10px; color: #9fb4cf; background: #262c36; border: 1px solid #333944;
}

/* ══ 結構分析表 ════════════════════════════════════ */
#anaBody { padding: 6px 14px 14px; }
table.ana { width: 100%; border-collapse: collapse; font-size: 12px; }
table.ana td {
  padding: 4px 0; vertical-align: top; line-height: 1.5;
}
table.ana td:first-child { color: #8b93a1; width: 48%; }
table.ana td:last-child { color: #e8eaed; font-variant-numeric: tabular-nums; }
/* 分節標題。要一眼看得出是標題，不能像可以填字的欄位。 */
table.ana th.grp {
  text-align: left;
  padding: 6px 0 5px;
  font-size: 10.5px; font-weight: 700;
  color: #7c8695; letter-spacing: 1.4px;
  border: none; border-bottom: 1px solid #333944;
  background: none;
}
table.ana tr:not(:first-child) th.grp { padding-top: 16px; }
.dim { color: #5f6672; font-size: 11px; }
.ok  { color: #7fd7a5; }
.bad { color: #e88f8f; }
.anaFoot { margin-top: 10px; font-size: 11px; color: #565c66; }

/* ══ 狀態列 ════════════════════════════════════════ */
/*
  左下角那一列。⚠ 定位在這個容器上，⛔ 不在裡面兩塊各自身上。

  🔴 原本 #status 自己 absolute。多一塊「量測讀數」之後，要讓兩塊
  並排而且【永遠不重疊】—— 靠給第二塊寫死一個 left 值辦不到，
  因為 #status 的寬度會隨內容變（物件名字一長就撞上去），
  而那種撞法【畫面上看起來只是擠在一起，不會有任何東西報錯】。
  → 包成 flex，寬度自己排開。

  pointer-events:none 從 #status 搬到這裡（意思不變：整列都穿得過去）。
*/
#hud {
  position: absolute;
  left: calc(10px + env(safe-area-inset-left));
  bottom: calc(10px + env(safe-area-inset-bottom));
  display: flex; align-items: flex-end; gap: 10px;
  pointer-events: none;
  /*
    ⚠ 兩塊加起來約 445px。平板直向（768）放得下，⛔ 但更窄的畫面會超出去。
    flex-wrap 是便宜的保險：塞不下就換行往上長（跟工具列 .grp 同一個作風），
    ⛔ 不會被切掉、也不會把畫面撐寬。
  */
  flex-wrap: wrap; max-width: calc(100% - 20px);
}
#status, #measureBox {
  padding: 8px 12px; border-radius: 8px;
  background: rgba(20,23,28,.85); border: 1px solid #3a3f48;
  font-size: 12px; line-height: 1.65;
  font-variant-numeric: tabular-nums;
}
#status b { color: #7fd7a5; font-weight: 600; }
#status .dim2 { color: #8b93a1; }

/*
  量測讀數（量測第 2 步）：選到的點／邊／面有多大。

  🔴 為什麼在左下角，⛔ 不是標在元素身上：kang 2026-08-27 實測退回 ——
  「顯示位置..目前顯示集中在 XYZ 控制軸..這樣很難選」。
  數字站在選取的重心上，而 gizmo 掛的就是同一個點，兩者【一定】會搶位置。

  字比狀態列大一點（13px）—— 它是【要讀出數字】的，不是狀態指示。
  沒選到子元素時整塊 hidden，⛔ 不留一個空框在那裡。
*/
#measureBox { font-size: 13px; color: #e8eaed; }
#measureBox b { color: #ffe07a; font-weight: 600; }
#measureBox .mHead { color: #8b93a1; font-size: 12px; }

/* ══ 提示條 ════════════════════════════════════════ */
#toast {
  position: absolute; left: 50%; transform: translateX(-50%);
  top: 12px; padding: 7px 14px; border-radius: 999px;
  background: rgba(47,111,208,.94); color: #fff;
  font-size: 13px; white-space: nowrap;
  opacity: 0; transition: opacity .25s; pointer-events: none; z-index: 5;
}
#toast.show { opacity: 1; }
#toast.bad { background: rgba(178,70,70,.95); }

/* ══ 大視窗（展開圖、3D 匯出共用）══════════════════
   展開圖是要拿去下料的圖，一定要看得夠大才看得清楚尺寸，
   所以做成蓋滿畫面的視窗，而不是擠進 300px 的側欄。
   圖面本身一律白底黑線 —— 那是印出來的樣子。
   3D 匯出視窗沿用同一套樣式，使用者不必再學一次怎麼操作。 */
.uwWin { position: fixed; inset: 0; z-index: 60; }
.uwWin[hidden] { display: none; }
.uwBack { position: absolute; inset: 0; background: rgba(0,0,0,.55); }
.uwBox {
  position: absolute; inset: 3% 3% 3%; display: flex; flex-direction: column;
  background: #20232a; border: 1px solid #3a3f48; border-radius: 10px;
  overflow: hidden; box-shadow: 0 12px 48px rgba(0,0,0,.5);
}
.uwHead {
  flex: none; display: flex; align-items: center; gap: 12px;
  padding: 10px 14px; background: #24272e; border-bottom: 1px solid #3a3f48;
}
.uwHead b { font-size: 13px; letter-spacing: .5px; }
.uwSum { flex: 1 1 auto; font-size: 11.5px; color: #8b93a1;
  font-variant-numeric: tabular-nums; }
.uwBar {
  flex: none; display: flex; flex-wrap: wrap; align-items: center; gap: 6px;
  padding: 8px 14px; background: #1d2026; border-bottom: 1px solid #2c313a;
}
.uwBar .lbl { font-size: 11px; color: #8b93a1; }
.uwBar .sp { width: 10px; }
.uwBar input[type=number] {
  padding: 5px 8px; border-radius: 5px;
  border: 1px solid #3f4550; background: #191c21; color: #e8eaed;
  font-variant-numeric: tabular-nums;
}
/* 編輯模式的數值輸入框。長得跟展開列那個一樣，因為它們是同一種東西：
   「把一個精確的數字打進去」。同一件事看起來要一樣，否則使用者要重學一次。 */
.grp input[type=number] {
  width: 74px; padding: 5px 7px; border-radius: 5px;
  border: 1px solid #3f4550; background: #191c21; color: #e8eaed;
  font-variant-numeric: tabular-nums;
}
.grp input[type=number]:disabled { opacity: .45; }
.grp .unit { font-size: 11px; color: #8b93a1; min-width: 22px; }
.uwCk {
  display: flex; align-items: center; gap: 5px;
  font-size: 11.5px; color: #a8b0bd; cursor: pointer;
  user-select: none; -webkit-user-select: none;
}
.uwCk input { width: 15px; height: 15px; margin: 0; }
/* 環境不支援指定路徑（用內網 IP 開就是這樣）時淡化，但不停用 ——
   使用者的偏好要留著，換到線上版就會生效 */
.uwCk.off { opacity: .45; }
.uwBody {
  flex: 1 1 auto; overflow: auto; -webkit-overflow-scrolling: touch;
  padding: 14px; padding-bottom: calc(20px + env(safe-area-inset-bottom));
}
.uwCard {
  margin: 0 0 16px; padding: 12px;
  background: #1c1f25; border: 1px solid #333944; border-radius: 8px;
}
.uwTitle { margin-bottom: 8px; font-size: 12px; line-height: 1.65; }
.uwTitle .nm { font-size: 13.5px; font-weight: 600; color: #e8eaed; }
.uwTitle .dim { color: #8b93a1; }
.uwTitle .bad { color: #e88f8f; }
.uwCard canvas {
  display: block; max-width: 100%; background: #fff;
  border-radius: 5px; border: 1px solid #333944;
}
.uwWarn, .uwSkip {
  margin: 0 0 12px; padding: 9px 12px; border-radius: 6px;
  font-size: 12px; line-height: 1.65;
}
.uwWarn { background: rgba(178,70,70,.14); border: 1px solid #7a4040; color: #f0b8b8; }
.uwSkip { background: rgba(47,111,208,.12); border: 1px solid #2c4a75; color: #a8c0e0; }
.uwBomWrap h3 { margin: 4px 0 8px; font-size: 12px; color: #8b93a1; font-weight: 600; }
table.uwBom { width: 100%; border-collapse: collapse; font-size: 12px; }
table.uwBom th, table.uwBom td {
  padding: 5px 8px; text-align: left; border-bottom: 1px solid #2c313a;
  font-variant-numeric: tabular-nums;
}
table.uwBom th { color: #8b93a1; font-weight: 600; font-size: 11px; }

/* ══ 3D 匯出視窗專用 ═══════════════════════════════ */
.exTag {
  display: inline-block; margin-left: 8px; padding: 1px 8px;
  border-radius: 999px; font-size: 10.5px; font-weight: 600; vertical-align: 2px;
}
.exTag.good { background: rgba(60,150,100,.18); border: 1px solid #3f7a5a; color: #7fd7a5; }
.exTag.bad  { background: rgba(178,70,70,.18);  border: 1px solid #7a4040; color: #e88f8f; }
table.exTab { border-collapse: collapse; font-size: 12px; margin-top: 4px; }
table.exTab td { padding: 3px 16px 3px 0; vertical-align: top; }
table.exTab td:first-child { color: #8b93a1; }
table.exTab td:last-child { color: #e8eaed; font-variant-numeric: tabular-nums; }

/* ══ 手指裝置 ══════════════════════════════════════ */
@media (pointer: coarse) {
  button { padding: 10px 13px; font-size: 14px; }
  button.mini { padding: 5px 10px; font-size: 12px; }
  .row input[type=text], .row input[type=number], .row select { padding: 8px; }
  .row input[type=checkbox] { width: 20px; height: 20px; }
}

/* ══ 窄螢幕：面板改成底部抽屜 ══════════════════════ */
@media (max-width: 900px) {
  #main { flex-direction: column; }
  #panel {
    width: 100%; flex: none; max-height: 42%;
    border-left: none; border-top: 1px solid #3a3f48;
  }
  #bar { gap: 5px; padding: 6px; }
  .grp { padding: 2px 6px; }
}
</style>

<script type="importmap">
{
  "imports": {
    "three": "./lib/three/three.module.min.js",
    "three/addons/": "./lib/three/addons/"
  }
}
</script>
</head>
<body>

<div id="app">

  <div id="bar">
    <div class="grp">
      <span class="lbl">檔案</span>
      <button id="newDoc">新建</button>
      <button id="load">讀檔</button>
      <button id="save">存檔</button>
    </div>

    <div class="grp">
      <span class="lbl">新增</span>
      <select id="primType"></select>
      <button id="add">加入</button>
      <button id="importSvg" title="匯入 Illustrator 的線稿（SVG）：封閉輪廓會擠出成 3D 物件，內孔自動挖掉">匯入線稿</button>
    </div>

    <div class="grp">
      <span class="lbl">編輯</span>
      <button id="undo" disabled>復原</button>
      <button id="redo" disabled>重做</button>
      <button id="dup" disabled>複製</button>
      <button id="del" class="warn" disabled>刪除</button>
    </div>

    <div class="grp" id="gBool">
      <span class="lbl">布林</span>
      <button id="bUnion" disabled title="聯集：把選取的物件合成一個">∪ 聯集</button>
      <button id="bSub" disabled title="差集：從第一個選取的物件挖掉其餘的">− 差集</button>
      <button id="bInt" disabled title="交集：只留下互相重疊的部分">∩ 交集</button>
    </div>

    <div class="grp" id="gArray">
      <span class="lbl">陣列</span>
      <button id="aLinear" disabled title="線性陣列：沿一個方向等距排開。第二方向填大於 1 就變成網格">排列</button>
      <button id="aRadial" disabled title="環形陣列：繞一個軸平均分佈，例如法蘭上的螺栓孔">環形</button>
      <button id="aMirror" disabled title="鏡射：對稱複製一份，例如機箱的左右側板">鏡射</button>
    </div>

      -->
      <button id="subdivEdge" disabled title="邊上加點：在選到的邊上放點，什麼都不連。放好之後用「多點連接」把它們連成你要的形狀。要放在特定位置，加完用「拉點」移過去">邊上加點</button>
      <input id="subdivN" type="number" min="1" max="32" step="1" value="1"
             title="每條邊上加幾個點，平均分佈。1 就是中點">
      <button id="connectVerts" disabled title="多點連接：選好幾個角，照你選的順序一段一段連起來，面會被切開。兩個點就是連一條線。形狀完全不變，新的線會自動選中，接著用箭頭拉就能做屋頂、折線。⚠ 每一段的兩個點要在同一個面上，而且不能相鄰（相鄰本來就有線了）">多點連接</button>
      <!--
        面上加線：跟「連接兩點」分成兩顆，kang 2026-08-25 拍板
        （「畢竟效果呈現不同」）。

          連接兩點  選兩個既有的角 → 方塊頂面切成兩個三角形
          面上加線  選兩條邊，各長一個點 → 方塊頂面切成兩個矩形

        🔴 位置框旁邊那個 0.5 ＝ 正中間（＝ kang 要的「兩等分」）。
        ⚠ 兩條邊在面的迴圈上是繞著走的，所以第二條要反過來算，
        否則 0.3 會切出一條斜線 —— 見 edit.js splitFaceByEdges() 檔頭。
      -->
      <button id="splitFace" disabled title="面上加線：在同一個面上選兩條邊，各長出一個點再連起來，那個面被切成兩塊。0.5 就是正中間（兩等分）。形狀完全不變，新的線會自動選中。⚠ 那兩條邊的另一側也會跟著多一個點，那是必須的，不然網格會破洞">面上加線</button>
      <input id="splitFaceT" type="number" min="0.01" max="0.99" step="0.05" value="0.5"
             title="切在邊的哪個位置：0.5 ＝ 正中間（兩等分），0.3 ＝ 靠一邊三成。兩條邊會一起移，切出來的線是平行的">
    </div>

    <!--
      法向：⚠ 這一組跟「編輯」分開，因為它**不需要進編輯模式**——
      選到物件就能按。它修的是整個物件，不是某一個元素。
    -->
    <div class="grp" id="gNormal">
      <span class="lbl">法向</span>
      <button id="fixNormals" disabled title="修法向：把面的朝向重算成「一致而且朝外」。⚠ 繞向錯了畫面上完全看不出來，但 STL 送去列印會被判成非流形。3D 列印面板報「法向朝內」時就按這個">修法向</button>
      <button id="flipNormals" disabled title="翻面：把整個物件的面朝向全部翻過來。⚠ 板件那種沒有厚度的殼，「外側」在數學上沒有定義，「修法向」不會去猜——那時候用這顆自己決定">翻面</button>
    </div>

    <!--
      編輯模式專用。**只在按下「拉點線面」之後才出現** ——
      平常工具列已經很擠，而這兩樣東西在編輯模式以外沒有意義。
      「模式」那一組（移動／旋轉／縮放）不搬過來，它本來就在，
      而且編輯模式下用的是同一組按鈕（同一件事只給一個入口）。
    -->
    <div class="grp" id="gEditXf" hidden>
      <span class="lbl">方向</span>
      <button id="spWorld" class="spBtn on" data-s="world" title="箭頭朝世界的 X／Y／Z">世界</button>
      <button id="spNormal" class="spBtn" data-s="normal" title="箭頭朝選到那個元素自己的方向：藍色那根（Z）就是面的法向。推斜面、拉梯形靠這個">法向</button>
      <span class="lbl">中心</span>
      <button id="pvMedian" class="pvBtn on" data-p="median" title="中心＝全部選取頂點的重心。選兩個面要縮放時，東西會往兩面中間收">重心</button>
      <button id="pvActive" class="pvBtn" data-p="active" title="中心＝最後點的那一個元素（畫成橘色的那個）。選兩個面要縮放時，東西會往那一面收。單選時跟「重心」是同一個點">最後選的</button>
      <!--
        🔴 這個字會跟著動作換成「移動／旋轉／縮放」（見 main.js updateEditNum）。
        原本固定寫「數值」，而 kang 2026-08-25 的回報是
        「看座標無法真正知道我移動多少」—— 位移量其實一直都印在這裡，
        只是欄位名稱看不出那是什麼。⛔ 不要改回固定字串。
      -->
      <span class="lbl" id="editNumLbl"
            title="拖曳中會即時顯示這一次移動／旋轉／縮放了多少，放開之後可以直接打精確數字按 Enter">數值</span>
      <input id="editNum" type="number" step="0.1" disabled
             title="拖過一次之後，可以直接打一個精確的數字取代拖出來的量（移動＝cm、旋轉＝度、縮放＝倍）。只在拉單一一根箭頭時給得出數字">
      <span id="editNumUnit" class="unit">—</span>
    </div>

    <div class="grp" id="gUnfold">
      <span class="lbl">展開</span>
      <button id="mate" title="貼合：先點要移動的物件的點／邊／面，再點目標的點／邊／面，自動轉正並貼上去">貼合</button>
      <button id="seam" title="指定分片：自己決定展開圖從哪裡切開。要先把物件「轉成可編輯網格」才能標">分片</button>
      <button id="unfold" title="把板件攤平成下料圖：含尺寸標註、折線、折彎補償，可列印或輸出 DXF 送雷切">展開圖</button>
      <button id="slice" title="剖面分切：切成一疊板，每片一張輪廓送 CNC，切完照號碼疊起來黏合。任何形狀都切得開，不受可展性限制">剖面分切</button>
      <button id="export3d" title="匯出 STL 給 3D 列印或 CAM。匯出前會先檢查模型封不封閉、法向對不對">3D 列印</button>
    </div>

    <div class="grp">
      <span class="lbl">模式</span>
      <button id="mMove" class="on">移動</button>
      <button id="mRot">旋轉</button>
      <button id="mScale">縮放</button>
      <button id="multi">加選</button>
      <button id="marquee" title="框選：拖曳畫一個矩形，碰到的物件全部選起來。開著時空白處拖曳不再旋轉視角">框選</button>
    </div>

    <div class="grp">
      <span class="lbl">吸附</span>
      <button class="snapBtn" data-s="0">關</button>
      <button class="snapBtn on" data-s="1">1cm</button>
      <button class="snapBtn" data-s="5">5cm</button>
      <button class="snapBtn" data-s="10">10cm</button>
    </div>

    <div class="grp">
      <span class="lbl">視角</span>
      <button id="vFront" title="正視圖（從前面看）。對齊要靠這個 —— 透視圖裡對不準">前</button>
      <button id="vRight" title="右側視圖">側</button>
      <button id="vTop" title="上視圖（俯視）">上</button>
      <button id="vIso" class="on" title="等角（斜看）">等角</button>
      <button id="vOrtho" title="正交投影：關掉近大遠小。要精確對位一定要開">正交</button>
    </div>

    <div class="grp">
      <span class="lbl">檢視</span>
      <button id="edges" class="on">稜線</button>
      <button id="wire">線框</button>
      <button id="frame">全部入鏡</button>
    </div>
  </div>

  <div id="main">
    <div id="stage">
      <canvas id="cv"></canvas>
      <div id="marqueeBox" hidden></div>
      <div id="toast"></div>
      <div id="hud">
        <div id="status">
          <!-- ⛔ 這裡不要加 title 說明：#hud 是 pointer-events:none（見上面的 CSS），
               滑鼠穿過去不會停在它身上，所以 title 永遠不會跳出來。
               2026-08-26 加過一次，kang 實測時發現「我要怎麼看？」——
               那正是「開清單前先問：使用者驗得出這個結果嗎」漏掉的一項。
               ⚠ 拿掉 pointer-events:none 可以讓 title 生效，但那樣這一列
               就會擋住左下角那塊模型（連從那裡開始拖曳轉視角都會失效）——
               為了一個說明賠掉一塊可以操作的畫面，不划算。
               ⚠ 2026-08-27 那個屬性搬到 #hud 了，意思不變：整列都穿得過去。 -->
          <div><b id="sFps">–</b> FPS　<span class="dim2">三角形</span> <b id="sTri">0</b></div>
          <div><span class="dim2">物件</span> <b id="sObj">0</b>　<span class="dim2">已選</span> <b id="sSel">0</b></div>
          <div class="dim2" id="sInfo">點一下物件選取它</div>
        </div>
        <!--
          量測讀數。內容由 js/main.js 的 updateMeasureBox() 填，
          而那串字是 js/core/measure.js 的 measureLabels('total') 產生的
          —— ⛔ 跟右邊面板同一個 measureSelection() 來源，⛔ 不另算一份。
        -->
        <div id="measureBox" hidden></div>
      </div>
    </div>

    <div id="panel"></div>
  </div>

</div>

<script type="module" src="./js/main.js"></script>
</body>
</html>
