<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>建模器 — 第 3 期</title>
<!-- 加到主畫面（跟另外兩個工具同一套做法）。
     manifest 放在上一層跟另外兩份並排，裡面的路徑是相對於 manifest 自己的位置。
     black-translucent 會讓內容跑到 iOS 狀態列底下，所以版面一律靠
     env(safe-area-inset-*) 讓開 —— 這是專案踩過的坑第 7 條。 -->
<link rel="manifest" href="../manifest-modeler.webmanifest">
<meta name="theme-color" content="#1b1e23">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="建模器">
<link rel="apple-touch-icon" href="../icons/modeler-180.png">
<style>
/* ══ 基本 ══════════════════════════════════════════ */
* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0; height: 100%; overflow: hidden;
  background: #1b1e23; color: #e8eaed;
  font-family: "Microsoft JhengHei", "PingFang TC", system-ui, sans-serif;
  font-size: 14px; overscroll-behavior: none;
}
#app { position: fixed; inset: 0; display: flex; flex-direction: column; }

/* ══ 工具列 ════════════════════════════════════════ */
#bar {
  flex: none; z-index: 20;
  display: flex; flex-wrap: wrap; align-items: center; gap: 6px;
  padding: 8px calc(8px + env(safe-area-inset-right)) 8px calc(8px + env(safe-area-inset-left));
  padding-top: calc(8px + env(safe-area-inset-top));
  background: #24272e; border-bottom: 1px solid #3a3f48;
}
.grp {
  /* flex-wrap：一組按鈕自己也要能換行。
     #bar 本來就會在「組與組之間」換行，但**單一組塞不下時只會被切掉**，
     而被切掉的按鈕看起來就像不存在。工具列每加一顆按鈕就更窄一分，
     平板尤其容易踩到。加這一行的成本是零。 */
  display: flex; align-items: center; gap: 4px; flex-wrap: wrap;
  padding: 3px 8px 3px 6px; border: 1px solid #3a3f48; border-radius: 8px;
}
/* 🔴🔴 ⛔ 這一行【不是多餘的】—— ⛔ 不要因為「hidden 本來就會隱藏」把它刪掉。

   `hidden` 屬性的效果是 `display: none`，但那是【瀏覽器預設樣式】，
   而上面的 `.grp { display: flex }` 是【作者樣式】—— **作者的贏**。
   ⇒ ⛔ 沒有這一行，`g.hidden = true` 對 `.grp`【完全不生效】，
     而且**不會報錯、看起來就像程式沒跑到**。

   ⭐ 這個專案已經踩過一次：底下 `.uwWin[hidden] { display: none; }`
     就是為了同一件事存在的。 */
.grp[hidden] { display: none; }
.grp > .lbl {
  flex: none; white-space: nowrap;
  font-size: 11px; color: #8b93a1; margin-right: 2px;
}
button, select, input {
  font-family: inherit; font-size: 13px;
}
button {
  flex: none; white-space: nowrap;
  padding: 6px 11px; border-radius: 6px;
  border: 1px solid #454b56; background: #2f333c; color: #e8eaed;
  cursor: pointer; user-select: none; -webkit-user-select: none;
}
button:hover:not(:disabled) { background: #3a3f4a; }
button:active:not(:disabled) { background: #4a5160; }
button.on { background: #2f6fd0; border-color: #4d8ae8; color: #fff; }
button.warn { border-color: #7a4040; }
button:disabled { opacity: .35; cursor: default; }
select {
  padding: 6px 8px; border-radius: 6px;
  border: 1px solid #454b56; background: #2f333c; color: #e8eaed;
}

/* ══ 主體 ══════════════════════════════════════════ */
#main { flex: 1 1 auto; display: flex; min-height: 0; }

/* ═══ 折疊條（2026-08-31）═══════════════════════════════
   🔴🔴 `#bar[hidden]` 這一行**不是多餘的** —— 跟 `.grp[hidden]` 同一個坑：
   `hidden` 的 `display:none` 是【瀏覽器預設樣式】，而 `#bar { display:flex }`
   是【作者樣式】—— 作者的贏。⛔ 沒有這一行，收合【完全不生效而且不報錯】。
   ⚠ `#panel` 目前沒有寫 display，所以本來就收得起來；
   ⭐ 但一併寫上去 —— 這個專案已經在同一個坑上跌過兩次。 */
#bar[hidden], #panel[hidden] { display: none; }

/* ═══ 左側工具直條（2026-08-31，介面編排第 1 段）═══════════════
   ⚠ 寬度 66px 是【量過才選的】：三案（文字 88／圖示 44／圖示＋小字 66）
     在 1024px 平板上只差 4.3%，⛔ 所以不是為了省寬度選的，是為了好認。
     真正吃寬度的是右邊那塊 #panel（300px）。

   🔴 每顆的高度 ≥ 44px 是【觸控目標】的建議值 ——
     ⛔ 不是排版美感問題：這個工具要在平板上用，按不到就是壞的。
     （6 上 ＋ 18 圖示 ＋ 2 間距 ＋ 12 字 ＋ 6 下 ≈ 46px）

   ⚠ 直條可以捲動（overflow-y）—— 平板【橫放】時高度只有 768，
     ⛔ 不給捲的話最下面那顆會被切掉而且完全看不出來。

   🔴🔴 **⛔ 這一整塊 2026-08-31 被我的清理腳本誤刪過一次**
   （「從 .handle 刪到 #stage」，而它剛好夾在中間）——
   ⚠ **大括號平衡、四道機械檢查全過，是【看差異】才抓到的。**
   〔跟 2026-08-20 @media print 同一類：平衡⛔ 不代表對〕 */
#rail {
  flex: none; width: 66px; z-index: 15;
  background: #24272e; border-right: 1px solid #3a3f48;
  padding: 6px; display: flex; flex-direction: column; gap: 5px;
  overflow-y: auto; overflow-x: hidden;
}
#rail hr { border: 0; border-top: 1px solid #343943; margin: 3px 1px; width: 100%; }
/* ⚠ 這裡要重寫 padding/寬度：全域的 button 是「橫排一顆」的樣子 */
#rail .tool {
  width: 100%; padding: 6px 2px; gap: 2px;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  font-size: 10.5px; line-height: 1.1; white-space: nowrap;
}
#rail .tool svg {
  width: 18px; height: 18px;
  stroke: currentColor; fill: none; stroke-width: 1.7;
  stroke-linecap: round; stroke-linejoin: round;
}
/* ⚠ 圖示要跟著文字一起變色（.on 是白字藍底）—— currentColor 就是為了這個 */
#rail .tool .lab { display: block; }

/* 🔴 介面控制推到直條最底下 —— ⛔ 跟工具用分隔線隔開（見 #rail 那則註解） */
#rail hr.push { margin-top: auto; }
#rail .tool { position: relative; }
#rail .tool .badge {
  position: absolute; top: 3px; right: 5px;
  min-width: 15px; height: 15px; padding: 0 3px; border-radius: 8px;
  background: #2f6fd0; color: #fff; font-size: 9.5px; line-height: 15px;
  text-align: center; font-weight: 600;
}
/* ⚠ 同一個坑的預防針：badge 沒有寫 display，本來就收得起來，但這個專案
   已經在「作者樣式蓋過 hidden」上跌過兩次 —— ⭐ 先寫再說。 */
#rail .badge[hidden], #rail .ico[hidden] { display: none; }
#stage { flex: 1 1 auto; position: relative; min-width: 0; }
#cv { display: block; width: 100%; height: 100%; touch-action: none; }

/* 框選的矩形。pointer-events:none 讓它不會擋住底下的拖曳事件 */
#marqueeBox {
  position: absolute; z-index: 4; pointer-events: none;
  border: 1px solid #6fa8ff; background: rgba(111,168,255,.16);
}

/*
  ⛔ **`#knifeLine` 已於 2026-08-26 移除，不要再加回來。**

  它是刀具第一版（螢幕上那條橘虛線）留下的殘骸 —— 元素與 CSS 都還在，
  但**沒有任何一行程式在更新它**（grep 過整個 js/，沒有人寫 x2/y2）。

  🔴 **第一版失敗的原因正是「畫在螢幕上」**：切點是**模型上的位置**，
  畫在螢幕座標系裡，一轉視角就對不上（當時的症狀是「預覽一直亂跳」）。
  現在的預覽畫在 3D 場景裡（`scene.js` 的 `setKnifePreview()`），
  **一筆畫也走同一條路**，⛔ 不會把這個疊層挖回來。
*/

/* ══ 右側面板 ══════════════════════════════════════ */
#panel {
  flex: none; width: 300px; overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  background: #20232a; border-left: 1px solid #3a3f48;
  padding-bottom: calc(16px + env(safe-area-inset-bottom));
}
#panel section { border-bottom: 1px solid #2c313a; }
#panel h2 {
  margin: 0; padding: 10px 14px; font-size: 12px; font-weight: 600;
  color: #8b93a1; letter-spacing: .5px; background: #24272e;
  display: flex; justify-content: space-between; align-items: center;
}
button.mini {
  padding: 3px 9px; font-size: 11px; border-radius: 5px;
}
#panel .empty {
  padding: 22px 14px; text-align: center; color: #6f7681;
  font-size: 12.5px; line-height: 1.7;
}
#panel .empty span { font-size: 11.5px; color: #565c66; }
#pForm { padding: 8px 14px 14px; }
.row {
  display: flex; align-items: center; gap: 8px; margin: 6px 0;
}
.row > label {
  flex: none; width: 78px; font-size: 12px; color: #a8b0bd;
}
.row > input, .row > select { flex: 1 1 auto; min-width: 0; }
.row input[type=text], .row input[type=number], .row select {
  padding: 5px 8px; border-radius: 5px;
  border: 1px solid #3f4550; background: #191c21; color: #e8eaed;
  font-variant-numeric: tabular-nums;
}
.row input[type=checkbox] { width: 17px; height: 17px; flex: none; }
.row input[type=color] {
  flex: none; width: 46px; height: 28px; padding: 0;
  border: 1px solid #3f4550; border-radius: 5px; background: #191c21;
}
.row input:disabled { opacity: .4; }
.row.vec { gap: 6px; }
.row.vec > div { flex: 1 1 0; min-width: 0; display: flex; align-items: center; gap: 4px; }
.row.vec span { flex: none; font-size: 11px; color: #6f7681; width: 10px; }
.row.vec input { width: 100%; min-width: 0; }
#pForm .sub {
  margin: 14px 0 6px; padding-top: 10px; border-top: 1px solid #2c313a;
  font-size: 11px; color: #8b93a1; font-weight: 600; letter-spacing: .4px;
}
#pForm .note {
  margin: 8px 0; padding: 7px 10px; border-radius: 6px;
  background: rgba(47,111,208,.12); border: 1px solid #2c4a75;
  font-size: 11.5px; color: #a8c0e0; line-height: 1.6;
}
#pForm .badNote {
  margin: 8px 0; padding: 7px 10px; border-radius: 6px;
  background: rgba(178,70,70,.14); border: 1px solid #7a4040;
  font-size: 11.5px; color: #f0b8b8; line-height: 1.6;
}
button.wide { width: 100%; margin-top: 10px; }

/* 對齊面板：一列 = 一個軸，後面接三顆等寬的按鈕 */
.alignRow { display: flex; align-items: center; gap: 6px; margin: 6px 0; }
.alignRow > label {
  flex: none; width: 52px; font-size: 12px; color: #a8b0bd;
}
.alignRow > button {
  flex: 1 1 0; min-width: 0; padding: 5px 2px; font-size: 11.5px;
  white-space: nowrap;      /* 空間不足時被壓成直排，見坑第 5 條 */
}

/* ══ 布林運算樹 ════════════════════════════════════ */
.tree { margin: 4px 0 2px; }
.tree .op {
  display: flex; align-items: center; gap: 8px; margin: 8px 0 6px;
}
.tree .op > label { flex: none; width: 78px; font-size: 12px; color: #a8b0bd; }
.tree .op > select { flex: 1 1 auto; min-width: 0;
  padding: 5px 8px; border-radius: 5px;
  border: 1px solid #3f4550; background: #191c21; color: #e8eaed;
}
.tree .item {
  margin: 5px 0; border: 1px solid #333944; border-radius: 6px;
  background: #1c1f25; overflow: hidden;
}
.tree .itemHead {
  display: flex; align-items: center; gap: 7px;
  padding: 7px 9px; cursor: pointer; user-select: none; -webkit-user-select: none;
}
.tree .itemHead:hover { background: #232830; }
.tree .sym {
  flex: none; width: 20px; text-align: center;
  font-size: 13px; color: #7fb0f0; font-variant-numeric: tabular-nums;
}
.tree .nm {
  flex: 1 1 auto; min-width: 0; font-size: 12px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.tree .dims { flex: none; font-size: 10.5px; color: #6f7681; }
.tree .caret { flex: none; font-size: 10px; color: #6f7681; width: 12px; }
.tree .itemBody {
  padding: 2px 9px 9px; border-top: 1px solid #2a2f38;
}
.tree .itemBody .row > label { width: 66px; font-size: 11.5px; }
.tree .roleTag {
  flex: none; padding: 1px 6px; border-radius: 4px;
  font-size: 10px; color: #9fb4cf; background: #262c36; border: 1px solid #333944;
}

/* ══ 結構分析表 ════════════════════════════════════ */
#anaBody { padding: 6px 14px 14px; }
table.ana { width: 100%; border-collapse: collapse; font-size: 12px; }
table.ana td {
  padding: 4px 0; vertical-align: top; line-height: 1.5;
}
table.ana td:first-child { color: #8b93a1; width: 48%; }
table.ana td:last-child { color: #e8eaed; font-variant-numeric: tabular-nums; }
/* 分節標題。要一眼看得出是標題，不能像可以填字的欄位。 */
table.ana th.grp {
  text-align: left;
  padding: 6px 0 5px;
  font-size: 10.5px; font-weight: 700;
  color: #7c8695; letter-spacing: 1.4px;
  border: none; border-bottom: 1px solid #333944;
  background: none;
}
table.ana tr:not(:first-child) th.grp { padding-top: 16px; }
.dim { color: #5f6672; font-size: 11px; }
.ok  { color: #7fd7a5; }
.bad { color: #e88f8f; }
.anaFoot { margin-top: 10px; font-size: 11px; color: #565c66; }

/* ══ 狀態列 ════════════════════════════════════════ */
/*
  左下角那一列。⚠ 定位在這個容器上，⛔ 不在裡面兩塊各自身上。

  🔴 原本 #status 自己 absolute。多一塊「量測讀數」之後，要讓兩塊
  並排而且【永遠不重疊】—— 靠給第二塊寫死一個 left 值辦不到，
  因為 #status 的寬度會隨內容變（物件名字一長就撞上去），
  而那種撞法【畫面上看起來只是擠在一起，不會有任何東西報錯】。
  → 包成 flex，寬度自己排開。

  pointer-events:none 從 #status 搬到這裡（意思不變：整列都穿得過去）。
*/
#hud {
  position: absolute;
  left: calc(10px + env(safe-area-inset-left));
  bottom: calc(10px + env(safe-area-inset-bottom));
  display: flex; align-items: flex-end; gap: 10px;
  pointer-events: none;
  /*
    ⚠ 兩塊加起來約 445px。平板直向（768）放得下，⛔ 但更窄的畫面會超出去。
    flex-wrap 是便宜的保險：塞不下就換行往上長（跟工具列 .grp 同一個作風），
    ⛔ 不會被切掉、也不會把畫面撐寬。
  */
  flex-wrap: wrap; max-width: calc(100% - 20px);
}
#status, #measureBox {
  padding: 8px 12px; border-radius: 8px;
  background: rgba(20,23,28,.85); border: 1px solid #3a3f48;
  font-size: 12px; line-height: 1.65;
  font-variant-numeric: tabular-nums;
}
#status b { color: #7fd7a5; font-weight: 600; }
#status .dim2 { color: #8b93a1; }

/*
  量測讀數（量測第 2 步）：選到的點／邊／面有多大。

  🔴 為什麼在左下角，⛔ 不是標在元素身上：kang 2026-08-27 實測退回 ——
  「顯示位置..目前顯示集中在 XYZ 控制軸..這樣很難選」。
  數字站在選取的重心上，而 gizmo 掛的就是同一個點，兩者【一定】會搶位置。

  字比狀態列大一點（13px）—— 它是【要讀出數字】的，不是狀態指示。
  沒選到子元素時整塊 hidden，⛔ 不留一個空框在那裡。
*/
#measureBox { font-size: 13px; color: #e8eaed; }
#measureBox b { color: #ffe07a; font-weight: 600; }
#measureBox .mHead { color: #8b93a1; font-size: 12px; }

/* ══ 提示條 ════════════════════════════════════════ */
#toast {
  position: absolute; left: 50%; transform: translateX(-50%);
  top: 12px; padding: 7px 14px; border-radius: 999px;
  background: rgba(47,111,208,.94); color: #fff;
  font-size: 13px; white-space: nowrap;
  opacity: 0; transition: opacity .25s; pointer-events: none; z-index: 5;
}
#toast.show { opacity: 1; }
#toast.bad { background: rgba(178,70,70,.95); }

/* ══ 大視窗（展開圖、3D 匯出共用）══════════════════
   展開圖是要拿去下料的圖，一定要看得夠大才看得清楚尺寸，
   所以做成蓋滿畫面的視窗，而不是擠進 300px 的側欄。
   圖面本身一律白底黑線 —— 那是印出來的樣子。
   3D 匯出視窗沿用同一套樣式，使用者不必再學一次怎麼操作。 */
.uwWin { position: fixed; inset: 0; z-index: 60; }
.uwWin[hidden] { display: none; }
.uwBack { position: absolute; inset: 0; background: rgba(0,0,0,.55); }
.uwBox {
  position: absolute; inset: 3% 3% 3%; display: flex; flex-direction: column;
  background: #20232a; border: 1px solid #3a3f48; border-radius: 10px;
  overflow: hidden; box-shadow: 0 12px 48px rgba(0,0,0,.5);
}
.uwHead {
  flex: none; display: flex; align-items: center; gap: 12px;
  padding: 10px 14px; background: #24272e; border-bottom: 1px solid #3a3f48;
}
.uwHead b { font-size: 13px; letter-spacing: .5px; }
.uwSum { flex: 1 1 auto; font-size: 11.5px; color: #8b93a1;
  font-variant-numeric: tabular-nums; }
.uwBar {
  flex: none; display: flex; flex-wrap: wrap; align-items: center; gap: 6px;
  padding: 8px 14px; background: #1d2026; border-bottom: 1px solid #2c313a;
}
.uwBar .lbl { font-size: 11px; color: #8b93a1; }
.uwBar .sp { width: 10px; }
.uwBar input[type=number] {
  padding: 5px 8px; border-radius: 5px;
  border: 1px solid #3f4550; background: #191c21; color: #e8eaed;
  font-variant-numeric: tabular-nums;
}
/* 編輯模式的數值輸入框。長得跟展開列那個一樣，因為它們是同一種東西：
   「把一個精確的數字打進去」。同一件事看起來要一樣，否則使用者要重學一次。 */
.grp input[type=number] {
  width: 74px; padding: 5px 7px; border-radius: 5px;
  border: 1px solid #3f4550; background: #191c21; color: #e8eaed;
  font-variant-numeric: tabular-nums;
}
.grp input[type=number]:disabled { opacity: .45; }
.grp .unit { font-size: 11px; color: #8b93a1; min-width: 22px; }
.uwCk {
  display: flex; align-items: center; gap: 5px;
  font-size: 11.5px; color: #a8b0bd; cursor: pointer;
  user-select: none; -webkit-user-select: none;
}
.uwCk input { width: 15px; height: 15px; margin: 0; }
/* 環境不支援指定路徑（用內網 IP 開就是這樣）時淡化，但不停用 ——
   使用者的偏好要留著，換到線上版就會生效 */
.uwCk.off { opacity: .45; }
.uwBody {
  flex: 1 1 auto; overflow: auto; -webkit-overflow-scrolling: touch;
  padding: 14px; padding-bottom: calc(20px + env(safe-area-inset-bottom));
}
.uwCard {
  margin: 0 0 16px; padding: 12px;
  background: #1c1f25; border: 1px solid #333944; border-radius: 8px;
}
.uwTitle { margin-bottom: 8px; font-size: 12px; line-height: 1.65; }

<body>

<div id="app">

  <div id="bar">
    <div class="grp">
      <span class="lbl">檔案</span>
      <button id="newDoc">新建</button>
      <button id="load">讀檔</button>
      <button id="save">存檔</button>
    </div>

    <div class="grp">
      <span class="lbl">新增</span>
      <select id="primType"></select>
      <button id="add">加入</button>
      <button id="importSvg" title="匯入 Illustrator 的線稿（SVG）：封閉輪廓會擠出成 3D 物件，內孔自動挖掉">匯入線稿</button>
    </div>

    <div class="grp">
      <span class="lbl">編輯</span>
      <button id="undo" disabled>復原</button>
      <button id="redo" disabled>重做</button>
      <button id="dup" hidden>複製</button>
      <button id="del" class="warn" hidden>刪除</button>
    </div>

    <div class="grp" id="gBool">
      <span class="lbl">布林</span>
      <button id="bUnion" hidden title="聯集：把選取的物件合成一個">∪ 聯集</button>
      <button id="bSub" hidden title="差集：從第一個選取的物件挖掉其餘的">− 差集</button>
      <button id="bInt" hidden title="交集：只留下互相重疊的部分">∩ 交集</button>
    </div>

    <div class="grp" id="gArray">
      <span class="lbl">陣列</span>
      <button id="aLinear" hidden title="線性陣列：沿一個方向等距排開。第二方向填大於 1 就變成網格">排列</button>
      <button id="aRadial" hidden title="環形陣列：繞一個軸平均分佈，例如法蘭上的螺栓孔">環形</button>
      <button id="aMirror" hidden title="鏡射：對稱複製一份，例如機箱的左右側板">鏡射</button>
    </div>

    <div class="grp" id="gEdit">
      <span class="lbl">編輯</span>
      <!-- 🔴 `拉點線面` 2026-08-31 搬到左側工具直條 #rail（第 1 段）。
           ⚠ 底下那四顆過濾器（自動／點／邊／面）**還留在這裡** ——
           它們該跟著工具走進控制列，但那是第 3 段的事，⛔ 這一段刻意不動。 -->
      <button id="efAuto" class="efBtn on" data-f="auto" title="自動：點比邊小、邊比面小，小的優先">自動</button>
      <button id="efVert" class="efBtn" data-f="vertex" title="只選點：點不到就不選，不會掉到邊或面">點</button>
      <button id="efEdge" class="efBtn" data-f="edge" title="只選邊">邊</button>
      <button id="efFace" class="efBtn" data-f="face" title="只選面（整個共面區域，不是單一三角形）">面</button>
      <!--
        顯示點：kang 2026-08-25 實測抓到的洞 ——
        「角點還可以分辨..但是新增的點..除非開線框才可以找的到位置」。

        ⚠ 放在過濾器旁邊而不是「檢視」那一組，因為它只在
        「過濾器吃得到點」時才有意義（點／自動），跟檢視模式無關。
        🔴 開關本身就是效能的保險 —— 覺得卡就關掉，不必等人修。
      -->
      <!--
        標尺寸（量測第 2 步）：選到的點／邊／面有多大，顯示在【畫面左下角】。

        🔴 2026-08-27 kang 實測當場退回了第一版（原本標在元素身上）：
        　　「顯示位置..目前顯示集中在 XYZ 控制軸..這樣很難選」。
        　　病因是設計上必然 —— 那個字站在選取的重心上，而 gizmo 掛的
        　　就是同一個點，兩者一定搶位置。

        ⏭ 原本還有一段「每一個」（32 條邊各標自己的長度，標在元素身上），
        　　kang 同日決定「每一個先暫時收起來...我思考一下還有甚麼方式
        　　可以呈現..會在跟你說想法」——
        　　⛔ 不是不做：measureLabels() 的 'each' 與它的測試都還在，
        　　只是【介面上暫時沒有入口】。等他的想法再接回來。
        　　→ 剩兩段就是開關，所以做成按鈕（跟旁邊「顯示點」同一個作風，
        　　　 平板也比兩選項的下拉好按）。

        ⚠ 放在「顯示點」旁邊而不是「檢視」那一組，理由跟它一樣：
        　　只在編輯模式、選到子元素時才有意義，跟檢視模式無關。
      -->
      <!--
        量圓（量測第 4 步）：把選到的那一圈當成圓，報半徑／段數／每段弦長。

        🔴🔴 它一定要是【預設關的開關】，⛔ 不可以自動顯示 ——
        　　自動顯示就等於自動判斷「這一圈是不是圓」，而那個判斷【無解】：
        　　正多邊形的頂點永遠共圓、矩形的四個角也永遠共圓
        　　〔實證：方塊每個面都被判成圓，偏差 3.55e-15〕。
        　　自動報的話會在方塊的四條邊上報一個半徑 36.06 的圓 —— 那是誤報。

        ⭐ 開關就是繞過那個判準的方式，跟「變成正圓」同一招：
        　　使用者按了它又選了這一圈，就表示他要問這一圈的圓。

        🔴 弦長是真值、2πR 是參考 —— ⛔ 看到差額不要以為是誤差要補回去
        　　（日誌「尺寸的依據」）。想更接近圓就把 seg 開高，那是建模階段的決定。
      -->
      <!--
        點連成面（＝ Blender 的 F）：選好幾個點，照【選取順序】圍出一個面。

        ⭐ 它跟旁邊兩顆是一組，但各做各的：
        　　多點連接 → 一串點變一串【線】
        　　補洞　　 → 不必選，把每個【完整的一圈】邊界補成面
        　　點連成面 → 一串點變【一個面】← 補洞認不出的那種洞

        ⛔ 不做 Blender 那個「2 個點就建一條邊」——「多點連接」已經是那件事，
        　 兩顆按鈕做同一件事就是【功能之間的定位互相模糊】。
      -->
      <button id="faceFromVerts" hidden title="點連成面：選 3 個以上的點，照【你點選的順序】圍出一個面。⭐ 補洞只認得完整的一圈邊界，想自己挑幾個角拉一片出來就用這個。⚠ 選 4 個以上而它們不在同一個平面上時照樣會建，但會講出偏離多少（想弄平接著按「壓平」）。⛔ 只想把點連成線請用「多點連接」">點連成面</button>
      <button id="extrude" hidden title="擠出面：從選到的面長出新的一段（做鹿角就是重複這個動作）。先長一段吸附格距的距離，再用箭頭拉到想要的長度">擠出</button>
      <button id="flatten" hidden title="壓平：把選到的面壓到同一個平面上，然後自動併成一個面。⚠ 形狀會變（圓柱那一段會被削平）。想把好幾片 seg 變成一個平面就用它">壓平</button>
      <!--
        環切：選一條邊，程式沿著它繞出一整圈，在中間加上新的線。
        它只加線、不改形狀（體積精確不變），改形狀是接著「拉那一圈邊」的事。
        刀數放在按鈕旁邊而不是另開面板 —— 它是這顆按鈕的參數，不是一個模式。
      -->
      <!--
        變成正圓：把選到的那一圈點推回一個正圓（＝ Blender 的 To Circle）。
        它做兩件事：① 壓到同一個平面 ② 推到同一個半徑，兩件都要在提示裡講。
        ⛔ 它不做「把點平均分佈」—— 那是對照表上另一個獨立項目。
        半徑欄位選到東西時會自動填入擬合值，打數字可以覆蓋。
      -->
      <button id="toCircle" hidden title="變成正圓：把選到的那一圈點推回一個正圓。會先壓到同一個平面，再推到同一個半徑。半徑欄位會自動填入【最接近現在這一圈的圓】，要精確就自己打數字">變成正圓</button>
      <input id="circleR" type="number" min="0.01" step="0.1"
             title="圓的半徑（cm）：選到東西時會自動填入最接近的半徑，點移動最少。要改成精確尺寸就直接打數字">
      <button id="loopCut" hidden title="環切：選一條邊，沿著它繞一整圈加上新的線（方塊繞 4 條、32 段圓柱繞 32 條）。只加線不改形狀，切完那一圈會自動選中，直接用箭頭拉就能做斜面、收腰、階梯">環切</button>
      <input id="loopCutN" type="number" min="1" max="32" step="1" value="1"
             title="刀數：一次要切幾刀。切點平均分佈（1 刀在中點、2 刀在 1/3 與 2/3）">
      <!--
        沿面滑動：環切的搭檔。把選到的那一圈邊沿著表面挪位置。

        🔴 它跟「拉點線面」的差別，是這顆按鈕存在的唯一理由：
        拉邊是往一個方向硬拉，會【離開表面】；
        滑動是沿著兩側原本就有的那條邊走，【永遠貼著表面】。

        ⚠ 兩種單位的結果在【被拉歪過的形狀】上不一樣，所以兩個都給
        （kang 2026-08-28 拍板）：公分＝等距離、％＝等比例。
      -->
      <button id="slide" hidden title="沿面滑動：把選到的那一圈邊沿著表面挪位置，不會離開表面。環切完直接按這顆就能調切線的位置。正值往上（或畫面上比較高的那一側），打負數往反方向">沿面滑動</button>
      <input id="slideAmt" type="number" step="0.5" value="1"
             title="滑多少：正值往上、負值往下。滑過頭會停在端點並告訴你最多能滑多少" hidden>
      <!--
        ⚠ 這顆是【單顆切換】，不是一組互斥按鈕，所以 ⛔ 不用 class="on" ——
        藍底在這個工具列一律代表「開著」，單顆切換用它會被讀成開／關。
        改成【按鈕上的字就是目前的單位】，按一下換過去。
      -->
      <button id="slideUnit" data-u="cm"
              title="按一下切換單位。公分＝每個點都走一樣的距離；％＝每個點都走自己那一段的同一個比例（100% 剛好到底）。⚠ 形狀被拉歪過的時候，兩者結果不一樣。⭐ 這顆同時管「沿面滑動」與「平行複製」" hidden>公分</button>
      <!--
        平行複製：跟沿面滑動吃同一種選取（一整圈邊），但它【加線】而不是【搬線】。

        🔴 兩者的定位差別，一句話：
           沿面滑動 ＝ 把那一圈【挪走】（形狀會變、只動座標）
           平行複製 ＝ 在那一圈【兩側各加一圈】（形狀不變、只加線）

        ⭐ 單位刻意跟滑動共用同一顆「公分／％」按鈕 ——
           語意完全一樣，而工具列桌機上已經在換行了（kang 說優化延後）。
      -->
      <button id="offsetLoop" hidden title="平行複製：在選到的那一圈邊，兩側各加一圈平行的線。做加強筋、邊框、溝槽。只加線、形狀完全不變（體積面積精確不變）">平行複製</button>
      <input id="offsetW" type="number" min="0.1" step="0.5" value="2"
             title="離原本那一圈多遠。單位看旁邊那顆「公分／％」。超過就會停在端點並告訴你" hidden>
      <!--
        選一圈：跟環切共用同一支 edgeRing()，只是不切、只選。
        環切已經把走訪寫好了，這顆按鈕幾乎是免費的。
      -->
      <button id="selRing" hidden title="選一圈：從選到的那條邊【橫著跨過】四邊形繞一圈，全部選起來（方塊 4 條、32 段圓柱 32 條）。要一次拉整圈、或要看環切會切在哪，先按這個。⚠ 跟「選一條線」不同：這個是繞著物件一圈">選一圈</button>
      <button id="selLoop" hidden title="選一條線：從選到的那條邊【順著同一條線】一直走到底（球上選一條經線邊 → 整條經線從極走到極）。⚠ 需要四價的點：方塊與圓柱的角是三價，走不動只會選到一條，那是正常的。要選一整條經線標成分片切割線就用這個">選一條線</button>
      <button id="selRingFaces" hidden title="選一圈面：跟「選一圈」走同一條路，但選起來的是【面】不是邊（方塊 4 個側面、32 段圓柱 32 個側面、球一整條緯度帶 12 個）。要一整圈一起擠出、壓平、刪掉就用這個。⚠ 一樣要先選【一條邊】—— 從一個面出發的話有兩個方向，結果不唯一。按下去會自動切到「面」">選一圈面</button>
      <!--
        全選邊：kang 2026-08-25 實測逼出來的。

        🔴 他要做「方塊六面 12 邊圓角」，功能本來就做得到，
        但**要開加選點 12 下**，中間漏一條或重複點到同一條，
        就會有角落只導到兩條 → 被擋下來，而**畫面上看不出哪條沒選到**。
        → 功能沒問題，難的是選取。那正是能力對照表三大缺口之一。

        ⚠ 只做「邊」不做點與面，因為只有邊真的需要：
        內縮／擠出一次只吃一個面，點的全選 ＝ 整體移動（物件模式就能做）。
      -->
      <button id="selAllEdges" hidden title="全選邊：把這個物件所有看得見的邊一次選起來。要做整個物件的導角／圓角就先按它 —— 方塊 12 條邊不必再一條一條點">全選邊</button>
      <!--
        選轉角：依夾角一次選出模型上所有折起來的邊（Blender 的 Select Sharp Edges）。

        🔴 對分片是一條捷徑 —— 一次選出所有轉角，再決定哪幾條要標成切割線。
        ⚠ 邊界邊（平板四周、洞口那一圈）選不進來：它沒有夾角可以算，
        　 而 isMarkable() 早就擋掉了（「本來就是外輪廓」）。
        　 → 所以平板按下去是 0 條，那個情形一定要講出原因（坑第 21 條）。
      -->
      <button id="selSharp" hidden title="選轉角：把模型上所有【折起來】的邊一次選起來（夾角大於旁邊那個度數的）。標分片切割線時先按它，不必一條一條點。⚠ 平板的四周、洞口那一圈是【開口邊緣】，沒有夾角可以算，選不進來">選轉角</button>
      <input id="sharpDeg" type="number" min="1" max="180" step="1" value="30"
             title="幾度以上算轉角：方塊的角是 90 度、32 段圓柱的側面只有 11.25 度。放大只選明顯的折角，調小連緩轉角也選進來">
      <!--
        選相似：跟【最後選的】那一個同一類的，全部選起來。
        四種判準是 kang 2026-08-27 選的，四種都要。
        種子用 active（橘色那個）—— 跟「中心＝最後選的」同一套。
      -->
      <button id="selSimilar" hidden title="選相似：跟【最後選的】那一個同一類的元素全部選起來。要選起球的全部 32 片就用它，不必點 32 下。判準在旁邊挑">選相似</button>
      <select id="similarMode" title="什麼叫「相似」：同法向＝朝同一個方向的面；同面積＝一樣大的面；同邊長＝一樣長的邊；同邊數＝三角形選三角形、四邊形選四邊形">
        <option value="normal">同法向</option>
        <option value="area">同面積</option>
        <option value="length">同邊長</option>
        <option value="sides">同邊數</option>
      </select>
      <!--

          <div><b id="sFps">–</b> FPS　<span class="dim2">三角形</span> <b id="sTri">0</b></div>
          <div><span class="dim2">物件</span> <b id="sObj">0</b>　<span class="dim2">已選</span> <b id="sSel">0</b></div>
          <div class="dim2" id="sInfo">點一下物件選取它</div>
        </div>
        <!--
          量測讀數。內容由 js/main.js 的 updateMeasureBox() 填，
          而那串字是 js/core/measure.js 的 measureLabels('total') 產生的
          —— ⛔ 跟右邊面板同一個 measureSelection() 來源，⛔ 不另算一份。
        -->
        <div id="measureBox" hidden></div>
      </div>
    </div>

    <div id="panel"></div>
  </div>

</div>

<script type="module" src="./js/main.js"></script>
</body>
</html>
